<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fuzzy-area example</title>
    <link rel="stylesheet" href="dist/main.min.css">
    <style>
        .container {
            max-width: 480px;
        }

        .container__textarea {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <p>Type any letter or sm: or md: to get autocomplete</p>

    <div class="container" id="fuzzyarea">
        <textarea name="fuzzyarea" class="container__textarea"></textarea>
    </div>

    <script src="dist/main.min.js"></script>
    <!-- overwrite Prefix and Autocomplete -->
    <script src="variablesAndPrefixes.js"></script>
</body>
</html>
